<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="旅行費用精算">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <title>旅行費用精算ツール</title>
</head>
<body>
  <div id="app" class="container">
    <section id="mainView">
      <div class="card row space">
        <h1>旅行費用精算ツール</h1>
        <button id="showNewTripButton">新しい旅行を作成</button>
      </div>

      <div id="newTripFormCard" class="card hidden">
        <h2>旅行を追加</h2>
        <div class="grid">
          <div class="field"><label>旅行名</label><input id="newTripTitle" placeholder="例：京都旅行"></div>
          <div class="field"><label>行き先</label><input id="newTripPlace" placeholder="例：京都"></div>
          <div class="field"><label>開始日</label><input id="newTripStart" type="date"></div>
          <div class="field"><label>終了日</label><input id="newTripEnd" type="date"></div>
        </div>

        <div class="row" style="margin-top:10px">
          <div class="field">
            <label>旅行タイプ</label>
            <label><input type="radio" name="newTripType" value="domestic" checked> 国内</label>
            <label><input type="radio" name="newTripType" value="international"> 海外</label>
          </div>
          <div class="field">
            <label>複数通貨を使う</label>
            <label><input type="radio" name="newMultiCurrency" value="no" checked> いいえ</label>
            <label><input type="radio" name="newMultiCurrency" value="yes"> はい</label>
          </div>
          <div class="field hidden" id="newLocalCurrencyField">
            <label>主要通貨</label>
            <select id="newLocalCurrency"></select>
          </div>
        </div>

        <div class="card" style="margin-top:10px">
          <h3>参加者</h3>
          <div id="newTripParticipantList"></div>
          <div class="toolbar" style="margin-top:8px">
            <button id="addNewTripParticipantButton" class="secondary">参加者を追加</button>
          </div>
        </div>

        <div class="toolbar">
          <button id="createTripButton">作成</button>
          <button id="resetNewTripButton" class="secondary">リセット</button>
          <button id="hideNewTripButton" class="danger">閉じる</button>
        </div>
      </div>

      <div id="emptyTripMessage" class="note">旅行がありません。新しい旅行を作成してください。</div>
      <div id="tripList" class="trip-list"></div>
    </section>

    <section id="tripView" class="hidden">
      <div class="card row space">
        <div>
          <h2 id="tripHeading"></h2>
          <div id="tripSubheading" class="note"></div>
          <div id="participantDisplay" class="row" style="margin-top:8px"></div>
        </div>
        <div class="toolbar">
          <button id="homeButton" class="secondary">ホームへ戻る</button>
          <button id="participantEditButton">参加者編集</button>
          <button id="exportCsvButton">CSV出力</button>
        </div>
      </div>

      <div id="participantEditArea" class="card hidden">
        <h3>参加者編集</h3>
        <div id="tripParticipantEditList"></div>
        <div class="toolbar" style="margin-top:8px">
          <button id="addTripParticipantButton" class="secondary">参加者追加</button>
          <button id="confirmParticipantButton">確定</button>
          <button id="cancelParticipantButton" class="danger">キャンセル</button>
        </div>
      </div>

      <div class="card">
        <div class="row space">
          <h3>精算サマリー</h3>
          <button id="clearTripExpensesButton" class="danger">支出をすべて削除</button>
        </div>
        <div class="summary"><table id="summaryTable"></table></div>
        <div class="row" style="margin-top:10px">
          <div>未精算共通費合計：<strong id="unsettledCommonTotal"></strong></div>
          <div>1人あたり：<strong id="unsettledPerPerson"></strong></div>
        </div>
        <div id="settlementList" style="margin-top:8px"></div>
      </div>

      <div class="card">
        <div class="toolbar">
          <button id="showExpenseInputButton">支出入力を表示</button>
          <button id="hideExpenseInputButton" class="secondary">支出入力を閉じる</button>
        </div>

        <div id="expenseInputArea" class="hidden" style="margin-top:10px">
          <div id="inputList" class="inputs"></div>
          <div class="toolbar" style="margin-top:8px">
            <button id="addInputRowButton" class="secondary">入力行を追加</button>
            <button id="registerInputRowsButton">登録</button>
            <button id="resetInputRowsButton" class="danger">入力をリセット</button>
          </div>
        </div>
      </div>

      <div class="card table-wrap">
        <div id="emptyMessage" class="note">支出データがありません。</div>
        <table class="expenses">
          <thead>
            <tr>
              <th>日付</th><th>内容</th><th>分類</th><th>支払方法</th><th>支払状況</th><th>支払者</th><th>負担対象</th>
              <th>通貨</th><th>現地通貨額</th><th>円換算レート</th><th>日本円入力額</th><th>精算用日本円額</th><th>精算状態</th><th>メモ</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="expenseBody"></tbody>
        </table>
      </div>
    </section>

    <div class="note" id="syncStatus"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
